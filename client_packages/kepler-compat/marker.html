<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden;pointer-events:none}
#g{position:fixed;left:0;top:0;box-sizing:border-box;width:38px;height:38px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.25);border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font:500 15px/1 Inter,"Segoe UI",system-ui,sans-serif;opacity:0;will-change:transform;transition:opacity 250ms cubic-bezier(.25,1,.5,1)}
</style></head><body><span id="g">G</span><script>
// CEF cannot sample the game world for backdrop blur; keep the marker surface transparent.
const marker=document.getElementById('g');let target=null,current=null,last=0,animation=0;
window.setMarker=point=>{
 const valid=point&&Number.isFinite(point.x)&&Number.isFinite(point.y);
 if(valid){if(!target)current={x:point.x,y:point.y};target={x:point.x,y:point.y};}else target=null;
 marker.style.opacity=valid?'1':'0';
 if(valid&&!animation){last=performance.now();animation=requestAnimationFrame(animate);}
 if(!valid&&animation){cancelAnimationFrame(animation);animation=0;}
};
function animate(now){
 animation=0;if(!target||!current)return;
 const dt=Math.min(50,Math.max(0,now-last));last=now;
 if(target&&current){const a=1-Math.exp(-dt/32);current.x+=(target.x-current.x)*a;current.y+=(target.y-current.y)*a;marker.style.transform='translate3d('+current.x*innerWidth+'px,'+current.y*innerHeight+'px,0) translate(-50%,-50%)';}
 if(Math.abs(target.x-current.x)*innerWidth>.1||Math.abs(target.y-current.y)*innerHeight>.1)animation=requestAnimationFrame(animate);
}
</script></body></html>
