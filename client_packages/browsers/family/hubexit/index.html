<!DOCTYPE html>
<html lang="ru">
<head><script src="package://shared/kepler-asset-map.js"></script>
    <link rel="stylesheet" href="package://browsers/shared/cef-no-select.css">
    <script src="package://browsers/shared/cef-no-select.js"></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выход</title>
    <link rel="stylesheet" href="../../handler/Lib/css/fonts.css?v=2">
    <link rel="stylesheet" href="../../handler/Menu/UI/style.css?v=2">
    <link rel="stylesheet" href="../../handler/Lib/css/help.css?v=2">
    <link rel="stylesheet" href="../../shared/pedtalk-gta5rp.css?v=3">
    <style>
        .pedMenu-ansButton[data-id="cancel"] {
            background: rgba(150, 172, 215, 0.18);
        }

        .pedMenu-ansButton[data-id="cancel"]:hover {
            background: rgba(99, 118, 154, 0.28);
        }

        .pedMenu-ansButton[data-id="cancel"] .pedtalk-answer-label {
            color: rgba(201, 216, 255, 0.7);
        }
    </style>
</head>
<body>
    <div id="root" class="pedtalk-root">
        <div class="pedtalk-gradient"></div>
        <div id="pedMenu-block">
            <div class="yk-text w-5 s-20 pedtalk-actor" id="title">Выход из особняка</div>
            <div class="yk-text s-25 mt-5 pedtalk-text" id="hub-text">Куда вы хотите выйти?</div>
            <div id="pedMenu-scrol" class="yk-scroll" style="max-height: 225px; margin-top: 20px;">
                <div id="hub-buttons" class="pedtalk-answers-row"></div>
            </div>
        </div>
    </div>

    <script>
        var HUB_EXIT_BUTTONS = [
            { id: 'street', label: 'На улицу' },
            { id: 'garage', label: 'В семейный гараж' },
            { id: 'cancel', label: 'Отмена' }
        ];

        function trig() {
            try {
                if (typeof mp !== 'undefined' && mp.trigger) mp.trigger.apply(mp, arguments);
            } catch (_e) {}
        }

        function esc(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function renderButtons() {
            var box = document.getElementById('hub-buttons');
            if (!box) return;
            var html = '';
            HUB_EXIT_BUTTONS.forEach(function (btn) {
                html += '<div class="pedMenu-ansButton" data-id="' + esc(btn.id) + '">' +
                    '<span class="yk-text w-4 s-20 pe-none pedtalk-answer-label">' + esc(btn.label) + '</span></div>';
            });
            box.innerHTML = html;

            var nodes = box.querySelectorAll('.pedMenu-ansButton');
            for (var i = 0; i < nodes.length; i++) {
                nodes[i].onclick = function (e) {
                    trig('familyHubExit:pick', e.currentTarget.getAttribute('data-id'));
                };
            }
        }

        function hubExitShow(title) {
            var root = document.getElementById('root');
            if (!root) return;
            if (title) document.getElementById('title').textContent = title;
            renderButtons();
            root.classList.add('active');
        }

        function hubExitHide() {
            var root = document.getElementById('root');
            if (root) root.classList.remove('active');
        }

        document.addEventListener('DOMContentLoaded', function () {
            hubExitShow('');
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') trig('familyHubExit:pick', 'cancel');
        });
    </script>
</body>
</html>
