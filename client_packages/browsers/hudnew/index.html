<!DOCTYPE html>
<html lang="ru">
<head><script src="package://shared/kepler-asset-map.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="fonts.css?v=2" media="screen" />
    <link rel="stylesheet" href="style.css?v=20260916a" />
    <style id="path-quest-fix-p">
      /* Инлайн + уникальный id — CEF не должен держать старый блок */
      .top-case-stack {
        display: flex !important;
        flex-direction: column !important;
        align-items: flex-end !important;
        gap: 10px !important;
        position: relative !important;
      }
      .case-bonus {
        position: relative !important;
        top: auto !important;
        right: auto !important;
        left: auto !important;
        margin: 0 !important;
        transform: translateY(-3px) !important;
        z-index: 3 !important;
      }
      .path-quest {
        position: relative !important;
        top: auto !important;
        left: auto !important;
        right: auto !important;
        margin: 0 !important;
        transform: translate(1.5px, 4px) !important;
        z-index: 1 !important;
      }
      .path-quest-accent {
        box-shadow: none !important;
        outline: none !important;
        border: none !important;
      }
    </style>
</head>
<body>
    <div id="hud2-root">
        <div id="topRight" class="top-right">
            <div class="tr-line tr-line-brand">
                <span class="tr-gta">FLOW</span><span class="tr-rp"> DM</span>
                <span class="tr-sep">//</span>
                <span class="tr-online">(<span id="trIdLabel">ID</span> <span id="trRemote">0</span> из <span id="trOnline">0</span>)</span>
                <span class="tr-server">LA PUERTA</span>
            </div>
            <div class="tr-line tr-line-player">
                <span id="trNick" class="tr-nick">—</span>
                <span class="tr-id-wrap">[<span id="trStatic">0</span>]</span>
                <span id="trTime" class="tr-time">00:00</span>
                <span id="trDate" class="tr-date">00.00</span>
            </div>
        </div>

        <div class="top-case-cluster">
            <div id="vzp" class="vzp">
                <div class="vzp-row">
                    <div class="vzp-name-block">
                        <svg class="vzp-ico" viewBox="0 0 24 24" fill="#4da3ff" aria-hidden="true">
                            <path d="M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5l8-3z"/>
                        </svg>
                        <span id="vzpDefName" class="vzp-name">—</span>
                    </div>
                    <div id="vzpDefAlive" class="vzp-alive">0</div>
                </div>
                <div class="vzp-row">
                    <div class="vzp-name-block">
                        <svg class="vzp-ico" viewBox="0 0 24 24" fill="#c8cdd6" aria-hidden="true">
                            <path d="M14.5 3.5l6 6-1.4 1.4-1.8-1.8-7.4 7.4H7v-2.9l7.4-7.4-1.8-1.8L14.5 3.5zM5 19h4l-4 2v-2z"/>
                        </svg>
                        <span id="vzpAtkName" class="vzp-name">—</span>
                    </div>
                    <div id="vzpAtkAlive" class="vzp-alive">0</div>
                </div>
                <div id="vzpTimer" class="vzp-timer">00:00</div>
                <div id="vzpRole" class="vzp-role">Атака</div>
            </div>

            <div class="top-case-stack">
                <div id="caseBonus" class="case-bonus" style="position:relative;transform:translateY(-3px);z-index:3;">
                    <span class="case-bonus-text">До получения кейса</span>
                    <span id="caseBonusTime" class="case-bonus-time">1:00</span>
                    <span class="case-bonus-accent" aria-hidden="true"></span>
                </div>
                <div id="pathQuest" class="path-quest" style="position:relative;margin:0;transform:translate(1.5px,4px);z-index:1;">
                    <div id="pathQuestTitle" class="path-quest-title">Начало пути</div>
                    <div id="pathQuestDesc" class="path-quest-desc"></div>
                    <span class="path-quest-accent" aria-hidden="true"></span>
                </div>
            </div>
        </div>

        <!-- Слева от миникарты: резисты + патроны -->
        <div id="leftMiniStack" class="left-mini-stack">
            <div id="resistBox" class="resist-box">
                <div id="resistSpankRow" class="resist-row resist-row--spank">
                    <img class="resist-ico" src="package://browsers/hud/images/status-ico-spank.png" alt="">
                    <span id="resistSpankVal" class="resist-val">0</span>
                </div>
                <div id="resistAlcoRow" class="resist-row resist-row--alco">
                    <img class="resist-ico" src="package://browsers/hud/images/status-ico-alco.png" alt="">
                    <span id="resistAlcoVal" class="resist-val">0</span>
                </div>
                <div id="resistEnergyRow" class="resist-row resist-row--energy">
                    <img class="resist-ico" src="package://browsers/hud/images/status-ico-energy.png" alt="">
                    <span id="resistEnergyVal" class="resist-val">0</span>
                </div>
            </div>
            <div id="ammoBlock" class="ammo-block">
                <svg class="ammo-bullets" viewBox="0 0 32 32" aria-hidden="true">
                    <g clip-path="url(#hud2AmmoClip)">
                        <path fill="currentColor" fill-rule="evenodd" clip-rule="evenodd" d="M30.896 13.1408C30.8938 13.1356 30.8903 13.1253 30.8869 13.1151L30.8869 13.1151C30.8827 13.1024 30.8785 13.09 30.8767 13.0874L29.332 9.9968V6.77648C29.3325 5.37632 28.9391 4.00403 28.1965 2.81674L26.583 0.235271C26.479 0.0878032 26.3097 0 26.1294 0C25.9488 0 25.7797 0.0878032 25.6758 0.235271L24.0643 2.81674C23.322 4.00403 22.9283 5.37632 22.9288 6.77648V9.9968L21.3815 13.0858C21.3801 13.0886 21.3771 13.0974 21.3738 13.1072C21.3696 13.1195 21.3649 13.1334 21.3622 13.139C21.3458 13.1997 21.3343 13.2617 21.3281 13.3242V27.1976C21.3281 27.4923 21.567 27.7312 21.8617 27.7312H22.3952V28.7984H21.8617C21.567 28.7984 21.3281 29.0373 21.3281 29.332V31.4664C21.3281 31.7611 21.567 32 21.8617 32H30.3991C30.6938 32 30.9327 31.7611 30.9327 31.4664V29.332C30.9327 29.0373 30.6938 28.7984 30.3991 28.7984H29.8656V27.7312H30.3991C30.6938 27.7312 30.9327 27.4923 30.9327 27.1976V13.3242C30.9254 13.2622 30.9132 13.2007 30.896 13.1408ZM28.2648 8.52186V9.58905H23.996V8.52186H28.2648ZM23.996 6.77648C23.9958 5.57616 24.3329 4.40006 24.9694 3.38238L26.1304 1.52496L27.2914 3.38238C27.9279 4.40006 28.265 5.57616 28.2648 6.77648V7.45468H23.996V6.77648ZM28.4685 10.6562L29.5357 12.7906H22.7251L23.7923 10.6562H28.4685ZM22.3952 30.9328V29.8656H29.8656V30.9328H22.3952ZM23.4624 28.7984V27.7312H28.7984V28.7984H23.4624ZM22.3952 26.664V13.8578H29.8656V26.664H22.3952ZM17.4691 8.71344C17.3678 8.59202 17.2175 8.52194 17.0593 8.52194H13.8577C13.6996 8.52194 13.5495 8.59202 13.4479 8.71344L10.7799 11.915C10.7 12.0111 10.6562 12.132 10.6562 12.2571V27.1977C10.6562 27.4924 10.8951 27.7313 11.1898 27.7313H11.7234V28.7985H11.1898C10.8951 28.7985 10.6562 29.0374 10.6562 29.3321V31.4665C10.6562 31.7611 10.8951 32 11.1898 32H19.7273C20.0219 32 20.2609 31.7611 20.2609 31.4665V29.3321C20.2609 29.0374 20.0219 28.7985 19.7273 28.7985H19.1937V27.7313H19.7273C20.0219 27.7313 20.2609 27.4924 20.2609 27.1977V12.2571C20.2609 12.132 20.2171 12.0111 20.1371 11.915L17.4691 8.71344ZM11.7234 12.4502L14.1076 9.58912H16.8097L19.1937 12.4502V13.8579H11.7234V12.4502ZM19.1937 30.9329H11.7234V29.8657H19.1937V30.9329ZM18.1265 28.7985H12.7906V27.7313H18.1265V28.7985ZM19.1937 26.6641H11.7234V14.9251H19.1937V26.6641ZM1.05151 15.4586C1.05412 13.1022 2.9639 11.1925 5.32026 11.1899C7.67662 11.1925 9.58641 13.1022 9.58901 15.4586V27.1977C9.58901 27.4923 9.35009 27.7313 9.05542 27.7313H8.52182V28.7984H9.05542C9.35009 28.7984 9.58901 29.0374 9.58901 29.332V31.4664C9.58901 31.7611 9.35009 32 9.05542 32H1.58511C1.29043 32 1.05151 31.7611 1.05151 31.4664V29.332C1.05151 29.0374 1.29043 28.7984 1.58511 28.7984H2.1187V27.7313H1.58511C1.29043 27.7313 1.05151 27.4923 1.05151 27.1977V15.4586ZM2.1187 30.9328H8.52182V29.8656H2.1187V30.9328ZM3.18589 28.7984H7.45464V27.7313H3.18589V28.7984ZM2.1187 26.6641H8.52182V18.1266H2.1187V26.6641ZM2.1187 17.0594H8.52182V15.4586C8.52182 13.6906 7.08857 12.257 5.32026 12.257C3.55221 12.257 2.1187 13.6906 2.1187 15.4586V17.0594Z"/>
                    </g>
                    <defs>
                        <clipPath id="hud2AmmoClip"><rect width="32" height="32" fill="white"/></clipPath>
                    </defs>
                </svg>
                <div class="ammo-text">
                    <span id="ammoClip" class="ammo-clip">0</span>
                    <span class="ammo-sep"> / </span>
                    <span id="ammoTotal" class="ammo-total">∞</span>
                </div>
            </div>
        </div>

        <!-- Сверху миникарты: деньги/мик + улицы -->
        <div id="minimapStack" class="minimap-stack">
            <div id="moneyBar" class="money-bar">
                <div class="money-bar-left">
                    <div class="money-row">
                        <svg class="money-ico money-ico-card" viewBox="0 0 25 19" fill="currentColor" aria-hidden="true">
                            <path d="M25 4.959V3.641C25 2.13 23.776.906 22.266.906H2.734C1.224.906 0 2.13 0 3.641v1.318c0 .135.109.244.244.244h24.512c.135 0 .244-.109.244-.244z"/>
                            <path d="M0 7.01v8.35C0 16.87 1.224 18.094 2.734 18.094h19.532c1.51 0 2.734-1.224 2.734-2.734V7.01c0-.135-.109-.244-.244-.244H.244C.109 6.766 0 6.875 0 7.01zm6.25 6.396c0 .432-.35.782-.781.782H4.688c-.432 0-.782-.35-.782-.782v-.781c0-.432.35-.782.782-.782h.781c.431 0 .781.35.781.782v.781z"/>
                        </svg>
                        <span id="bankVal" class="money-val">0$</span>
                    </div>
                    <div class="money-row">
                        <svg class="money-ico money-ico-cash" viewBox="0 0 17 17" fill="currentColor" aria-hidden="true">
                            <path d="M8.998 10.922c.573-.14.996-.509.996-.933s-.423-.792-.996-.933v1.866z"/>
                            <path d="M8.5 3.021a5.479 5.479 0 1 0 0 10.958 5.479 5.479 0 0 0 0-10.958zm2.49 6.968c0 .962-.857 1.767-1.992 1.952v.543a.498.498 0 1 1-.996 0v-.543C6.867 11.756 6.01 10.951 6.01 9.989c0-.275.223-.498.498-.498s.498.223.498.498c0 .424.423.792.996.933V8.953c-1.135-.185-1.992-.99-1.992-1.952s.857-1.767 1.992-1.952V4.511a.498.498 0 1 1 .996 0v.538c1.135.185 1.992.99 1.992 1.952 0 .275-.223.498-.498.498s-.498-.223-.498-.498c0-.424-.423-.792-.996-.933v1.969c1.135.185 1.992.99 1.992 1.952z"/>
                            <path d="M8.002 6.068c-.573.141-.996.509-.996.933s.423.792.996.933V6.068z"/>
                            <path d="M8.5 0a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17zm0 14.975A6.475 6.475 0 1 1 8.5 2.025a6.475 6.475 0 0 1 0 12.95z"/>
                        </svg>
                        <span id="cashVal" class="money-val">0$</span>
                    </div>
                </div>
                <div class="money-bar-right">
                    <div id="micIco" class="status-ico" title="mic">
                        <svg viewBox="0 0 28 34" fill="currentColor" aria-hidden="true">
                            <path fill-rule="evenodd" clip-rule="evenodd" d="M19.58 16.26c0 3.63-2.95 6.58-6.58 6.58S6.42 19.89 6.42 16.26V6.58C6.42 2.95 9.37 0 13 0s6.58 2.95 6.58 6.58v9.68zM13 2.04c-2.5 0-4.54 2.04-4.54 4.54v9.68c0 2.5 2.04 4.54 4.54 4.54s4.54-2.04 4.54-4.54V6.58c0-2.5-2.04-4.54-4.54-4.54zm11.12 13.2c.56 0 1.02.46 1.02 1.02 0 6.35-4.9 11.58-11.12 12.1v3.6h4.54c.56 0 1.02.46 1.02 1.02s-.46 1.02-1.02 1.02H7.44c-.56 0-1.02-.46-1.02-1.02s.46-1.02 1.02-1.02h4.54v-3.6C5.76 27.84.86 22.61.86 16.26c0-.56.46-1.02 1.02-1.02s1.02.46 1.02 1.02c0 5.57 4.53 10.1 10.1 10.1s10.1-4.53 10.1-10.1c0-.56.46-1.02 1.02-1.02z"/>
                        </svg>
                    </div>
                    <div class="status-ico status-ico-mail" title="mail">
                        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="M3.5 5.5A1.5 1.5 0 0 1 5 4h14a1.5 1.5 0 0 1 1.5 1.5v13A1.5 1.5 0 0 1 19 20H5a1.5 1.5 0 0 1-1.5-1.5v-13zm1.5.4v.4l7 5.1 7-5.1v-.4H5zm14 1.9-6.55 4.78a1.5 1.5 0 0 1-1.8 0L4 7.8V18.5h15V7.8z"/>
                        </svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- Улицы + ЗЗ — сверху внутри миникарты (не внутри money-стека) -->
        <div id="streetBar" class="street-bar">
            <div class="street-bar-inner">
                <div class="street-text">
                    <div id="streetArea" class="street-area">—</div>
                    <div id="streetName" class="street-name">—</div>
                </div>
                <div id="streetDir" class="street-dir">N</div>
            </div>
        </div>

        <!-- Спидометр (горизонтальный) -->
        <div id="speedo" class="speedo">
            <div class="speedo-inner">
                <div class="speedo-top">
                    <div class="speedo-rpm">
                        <svg class="rpm-svg" viewBox="0 0 72 56" aria-hidden="true">
                            <path class="rpm-track" d="M8 48 A28 28 0 1 1 64 48" fill="none" stroke-width="5" stroke-linecap="round"/>
                            <path id="rpmArc" class="rpm-arc" d="M8 48 A28 28 0 1 1 64 48" fill="none" stroke-width="5" stroke-linecap="round"
                                stroke-dasharray="88" stroke-dashoffset="88"/>
                        </svg>
                    </div>
                    <div class="speedo-speed-block">
                        <div id="speedDigits" class="speed-digits">
                            <span class="spd-dim" id="spd0">0</span><span class="spd-dim" id="spd1">0</span><span id="spd2">0</span>
                        </div>
                        <div class="speedo-gear-col">
                            <div id="gearBadge" class="gear-badge">N</div>
                            <div class="speed-unit">kmh</div>
                        </div>
                    </div>
                    <div class="speedo-icons">
                        <div id="icoLock" class="sico sico-lock" title="doors">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 8V7a3 3 0 1 1 6 0v3H9z"/></svg>
                        </div>
                        <div id="icoEngine" class="sico sico-engine" title="engine">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 9V7h3V5h4v2h3v2h2v3h-1v2h2v2h-2v2H8v-2H6v-2h2v-2H7V9zm2 2h6v2H9v-2z"/></svg>
                        </div>
                        <div id="icoCruise" class="sico sico-cruise" title="cruise">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 12l4-3"/><path d="M8 16h8" opacity=".5"/></svg>
                        </div>
                        <div id="icoTurn" class="sico sico-turn" title="turn">
                            <svg viewBox="0 0 40 24" fill="currentColor"><path d="M14 6L6 12l8 6V14h6V10h-6V6z"/><path d="M26 6l8 6-8 6V14h-6V10h6V6z"/></svg>
                        </div>
                        <div id="icoBelt" class="sico sico-belt" title="belt">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a3 3 0 0 1 3 3v1.2c2.4.7 4 2.6 4 5.1V14l2 2v2H3v-2l2-2v-2.7c0-2.5 1.6-4.4 4-5.1V5a3 3 0 0 1 3-3zm0 8.5c-.8 0-1.5.7-1.5 1.5S11.2 13.5 12 13.5s1.5-.7 1.5-1.5S12.8 10.5 12 10.5zM8 18h8l-1.2 2H9.2L8 18z"/></svg>
                        </div>
                    </div>
                </div>
                <div class="speedo-bot">
                    <span id="fuelPctVal" class="fuel-pct">0%</span>
                    <div id="fuelSegs" class="fuel-segs" aria-hidden="true"></div>
                    <span id="odoVal" class="odo-val">000000</span>
                </div>
            </div>
        </div>
    </div>
    <div id="hudCrosshair" class="hud-crosshair-overlay" aria-hidden="true">
        <div id="hudChRoot" class="hud-ch-root">
            <div id="hudChVTop" class="hud-ch-v"></div>
            <div id="hudChMid" class="hud-ch-mid">
                <div id="hudChHLeft" class="hud-ch-h"></div>
                <div id="hudChDot" class="hud-ch-dot"></div>
                <div id="hudChHRight" class="hud-ch-h"></div>
            </div>
            <div id="hudChVBot" class="hud-ch-v"></div>
        </div>
    </div>
    <script src="app.js?v=20260914a"></script>
    <script src="hudmain-adapter.js?v=2"></script>
</body>
</html>
