<!doctype html>
<html lang="ru"><head><script src="package://shared/kepler-asset-map.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Legacy Roleplay · Inventory</title><link rel="stylesheet" href="style.css"></head><body>
<main id="inventory" hidden aria-label="Инвентарь">
<section id="equipment" class="panel equipment"><header><h1>ПЕРСОНАЖ <span class="title-divider">//</span> ИНВЕНТАРЬ</h1><span class="eyebrow">LEGACY ROLEPLAY</span></header><div id="equipmentGrid" class="equipment-grid"></div><div class="vitals"><span>Сытость <b id="satiety">—</b></span><span>Жажда <b id="thirst">—</b></span><span>Настроение <b id="mood">—</b></span></div></section>
<section id="character" class="character"><h2>ПЕРСОНАЖ</h2><div id="rotateArea" aria-label="Потяните мышью для поворота камеры"></div><span class="rotate-hint">Потяните мышью, чтобы повернуть обзор</span></section>
<section id="items" class="panel inventory-panel"><header><h1>ВАШИ ПРЕДМЕТЫ</h1><div class="weight"><span><strong id="currentWeight">0.0</strong> / <span id="maxWeight">10</span> <span id="capacityUnit">КГ</span></span><div class="weight-track"><i id="weightFill"></i></div></div></header>
<label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></svg><input id="search" type="search" placeholder="Поиск предметов…" autocomplete="off" aria-label="Поиск предметов"></label>
<section class="weapon-section" aria-label="Оружие"><div class="section-heading"><span>БЫСТРЫЙ ДОСТУП</span><small>КЛАВИШИ 1 · 2 · 3</small></div><div id="weaponsGrid" class="weapon-grid"></div></section>
<div class="storage-tabs"><button id="pocketsTab" class="storage-tab active" type="button">КАРМАНЫ</button><button id="bagTab" class="storage-tab" type="button" hidden>РЮКЗАК</button><small id="inventoryCount">0 / 20 СЛОТОВ</small></div><div id="itemsGrid" class="item-grid"></div><div id="selection" class="selection">Выберите предмет</div>
<footer class="dock"><button id="close"><kbd>ESC</kbd><span>Закрыть</span></button><button id="use" disabled><kbd>E</kbd><span>Использовать</span></button><button id="drop" disabled><kbd>R</kbd><span>Выбросить</span></button></footer></section>
<div id="notice" role="status" hidden></div><section id="dropConfirm" class="confirm" hidden><span class="eyebrow">ВЫБРОСИТЬ ПРЕДМЕТ</span><h2 id="dropName"></h2><p>Предмет появится рядом с персонажем. Его смогут подобрать другие игроки.</p><div><button id="cancelDrop">Отмена</button><button id="confirmDrop">Выбросить</button></div></section>
</main><script src="ui.js"></script><script src="package://controls/cef-input.js"></script></body></html>
