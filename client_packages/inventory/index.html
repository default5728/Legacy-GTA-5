<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Legacy RP - Inventory</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; user-select: none; }
    body {
      width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.72);
      display: flex; justify-content: center; align-items: center; overflow: hidden;
    }

    .inv-container {
      display: flex; gap: 24px; align-items: flex-start;
      background: rgba(18, 20, 26, 0.96); border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px; padding: 22px 28px; box-shadow: 0 16px 45px rgba(0,0,0,0.85);
      color: #eee;
    }

    /* Левая колонка: Персонаж */
    .left-panel { width: 285px; }
    .panel-header {
      font-size: 14px; font-weight: 700; display: flex; align-items: center;
      justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 10px; margin-bottom: 12px; letter-spacing: 0.5px;
    }
    .panel-header .title-accent { color: #ff9800; margin-right: 6px; }

    /* Статусы: Настроение, Сытость, Жажда */
    .status-row { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 14px; font-size: 12px; font-weight: 600; }
    .status-badge {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px;
      background: rgba(255,255,255,0.05); padding: 6px 4px; border-radius: 5px;
      border: 1px solid rgba(255,255,255,0.04);
    }

    /* Сетка слотов экипировки (3x5) */
    .equip-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
    .equip-slot {
      height: 70px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; position: relative; transition: all 0.15s;
    }
    .equip-slot:hover { border-color: rgba(255, 152, 0, 0.5); background: rgba(255, 152, 0, 0.06); }
    .equip-slot .equip-ico { font-size: 20px; opacity: 0.8; }
    .equip-slot .equip-lbl { font-size: 10px; color: #888; margin-top: 3px; font-weight: 500; }
    .equip-slot img.item-img { max-width: 44px; max-height: 44px; object-fit: contain; }

    /* Правая колонка: Ваши предметы */
    .right-panel { display: flex; flex-direction: column; }
    .inv-top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .inv-title { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 6px; }
    .inv-weight { font-size: 12px; color: #ff9800; font-weight: 600; }

    .inv-content-flex { display: flex; gap: 10px; }

    /* Быстрые слоты 1, 2, 3 */
    .quick-slots { display: flex; flex-direction: column; gap: 7px; }
    .quick-slot {
      width: 72px; height: 72px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px; position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .quick-slot .q-num { position: absolute; top: 3px; left: 6px; font-size: 10px; color: #666; font-weight: 700; }

    /* Основная сетка предметов 5x4 (20 слотов) */
    .main-grid {
      display: grid; grid-template-columns: repeat(5, 72px); grid-template-rows: repeat(4, 72px); gap: 7px;
    }
    .slot {
      background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 6px; position: relative; display: flex; flex-direction: column;
      align-items: center; justify-content: center; cursor: pointer; transition: 0.15s;
    }
    .slot:hover { border-color: rgba(255, 152, 0, 0.6); background: rgba(255, 152, 0, 0.07); }
    .slot.active { border-color: #ff9800; background: rgba(255, 152, 0, 0.14); }
    .slot-item-img { max-width: 44px; max-height: 44px; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6)); pointer-events: none; }
    .slot-weight { position: absolute; top: 4px; right: 5px; font-size: 9px; color: #777; }
    .slot-name { font-size: 9px; text-align: center; margin-top: 2px; color: #ccc; max-width: 66px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Окружение (вещи на земле) */
    .ground-panel { width: 72px; border-left: 1px solid rgba(255,255,255,0.08); padding-left: 10px; display: flex; flex-direction: column; gap: 7px; }
    .ground-title { font-size: 10px; color: #777; text-align: center; margin-bottom: 2px; text-transform: uppercase; }

    /* Нижние бинды */
    .inv-footer {
      margin-top: 14px; display: flex; justify-content: space-between; font-size: 11px; color: #777;
      border-top: 1px solid rgba(255,255,255,0.07); padding-top: 10px;
    }
    kbd { background: #272a33; border: 1px solid #3c404d; color: #eee; padding: 2px 6px; border-radius: 3px; font-weight: bold; }

    /* Контекстное меню ПКМ */
    .ctx-menu {
      position: absolute; background: #191b22; border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px; box-shadow: 0 5px 20px rgba(0,0,0,0.9); display: none; flex-direction: column; z-index: 1000;
      min-width: 130px; overflow: hidden;
    }
    .ctx-btn {
      background: none; border: none; color: #ccc; padding: 9px 14px; font-size: 12px;
      text-align: left; cursor: pointer; transition: 0.12s;
    }
    .ctx-btn:hover { background: #ff9800; color: #000; font-weight: 600; }
  </style>
</head>
<body>
  <div class="inv-container" id="invApp">
    <!-- Левая панель: Персонаж -->
    <div class="left-panel">
      <div class="panel-header">
        <div><span class="title-accent">👤</span> Персонаж // Инвентарь</div>
      </div>

      <div class="status-row">
        <div class="status-badge">😊 <span id="valMood">100%</span></div>
        <div class="status-badge">🍔 <span id="valHunger">100%</span></div>
        <div class="status-badge">🥤 <span id="valThirst">100%</span></div>
      </div>

      <div class="equip-grid">
        <div class="equip-slot" id="eq_ear" onclick="unequipSlot('ear')"><span class="equip-ico">👂</span><span class="equip-lbl">Серьги</span></div>
        <div class="equip-slot" id="eq_hat" onclick="unequipSlot('hat')"><span class="equip-ico">🧢</span><span class="equip-lbl">Шапка</span></div>
        <div class="equip-slot" id="eq_mask" onclick="unequipSlot('mask')"><span class="equip-ico">🎭</span><span class="equip-lbl">Маска</span></div>
        <div class="equip-slot" id="eq_glasses" onclick="unequipSlot('glasses')"><span class="equip-ico">🕶️</span><span class="equip-lbl">Очки</span></div>
        <div class="equip-slot" id="eq_top" onclick="unequipSlot('top')"><span class="equip-ico">👕</span><span class="equip-lbl">Верх</span></div>
        <div class="equip-slot" id="eq_armor" onclick="unequipSlot('armor')"><span class="equip-ico">🦺</span><span class="equip-lbl">Жилет</span></div>
        <div class="equip-slot" id="eq_access" onclick="unequipSlot('access')"><span class="equip-ico">🧣</span><span class="equip-lbl">Аксессуар</span></div>
        <div class="equip-slot" id="eq_undershirt" onclick="unequipSlot('undershirt')"><span class="equip-ico">🎽</span><span class="equip-lbl">Майка</span></div>
        <div class="equip-slot" id="eq_backpack" onclick="unequipSlot('backpack')"><span class="equip-ico">🎒</span><span class="equip-lbl">Рюкзак</span></div>
        <div class="equip-slot" id="eq_bracelet" onclick="unequipSlot('bracelet')"><span class="equip-ico">⌚</span><span class="equip-lbl">Браслет</span></div>
        <div class="equip-slot" id="eq_pants" onclick="unequipSlot('pants')"><span class="equip-ico">👖</span><span class="equip-lbl">Низ</span></div>
        <div class="equip-slot" id="eq_watch" onclick="unequipSlot('watch')"><span class="equip-ico">⏱️</span><span class="equip-lbl">Часы</span></div>
        <div class="equip-slot" id="eq_gloves" onclick="unequipSlot('gloves')"><span class="equip-ico">🧤</span><span class="equip-lbl">Перчатки</span></div>
        <div class="equip-slot" id="eq_shoes" onclick="unequipSlot('shoes')"><span class="equip-ico">👟</span><span class="equip-lbl">Обувь</span></div>
        <div class="equip-slot" id="eq_special" onclick="unequipSlot('special')"><span class="equip-ico">➕</span><span class="equip-lbl">Особое</span></div>
      </div>
    </div>

    <!-- Правая панель: Инвентарь 5x4 -->
    <div class="right-panel">
      <div class="inv-top-bar">
        <div class="inv-title"><span>📦</span> Ваши предметы</div>
        <div class="inv-weight">⚖️ <span id="curWeight">0.0</span> / <span id="maxWeight">15.0</span> кг</div>
      </div>

      <div class="inv-content-flex">
        <!-- 1, 2, 3 слоты быстрого доступа -->
        <div class="quick-slots">
          <div class="quick-slot" id="qSlot0"><span class="q-num">1</span></div>
          <div class="quick-slot" id="qSlot1"><span class="q-num">2</span></div>
          <div class="quick-slot" id="qSlot2"><span class="q-num">3</span></div>
        </div>

        <!-- Сетка 5x4 (20 слотов) -->
        <div class="main-grid" id="mainGrid"></div>

        <!-- Окружение -->
        <div class="ground-panel">
          <div class="ground-title">Окружение</div>
          <div class="slot" id="grSlot0"></div>
          <div class="slot" id="grSlot1"></div>
          <div class="slot" id="grSlot2"></div>
          <div class="slot" id="grSlot3"></div>
        </div>
      </div>

      <div class="inv-footer">
        <div><kbd>E</kbd> Использовать &nbsp;&bull;&nbsp; <kbd>R</kbd> Выбросить</div>
        <div><kbd>ESC</kbd> Закрыть</div>
      </div>
    </div>
  </div>

  <!-- Контекстное меню ПКМ -->
  <div class="ctx-menu" id="ctxMenu">
    <button class="ctx-btn" onclick="doAction('use')">Использовать</button>
    <button class="ctx-btn" onclick="doAction('drop')">Выбросить</button>
    <button class="ctx-btn" onclick="doAction('split')">Разделить</button>
  </div>

  <script>
    let activeIndex = -1;
    let inventoryItems = new Array(20).fill(null);

    const grid = document.getElementById('mainGrid');
    for (let i = 0; i < 20; i++) {
      const el = document.createElement('div');
      el.className = 'slot';
      el.onclick = () => selectItem(i);
      el.ondblclick = () => { selectItem(i); doAction('use'); };
      el.oncontextmenu = (e) => showContext(e, i);
      grid.appendChild(el);
    }

    function renderInventory() {
      for (let i = 0; i < 20; i++) {
        const slotEl = grid.children[i];
        slotEl.innerHTML = '';
        slotEl.classList.toggle('active', activeIndex === i);

        const itm = inventoryItems[i];
        if (itm) {
          const imgPath = itm.icon ? itm.icon : `./images/${itm.name}.png`;
          slotEl.innerHTML = `
            <span class="slot-weight">${itm.weight || 0.1}кг</span>
            <img class="slot-item-img" src="${imgPath}" onerror="this.src='./images/default.png'" />
            <span class="slot-name">${itm.title || itm.name}</span>
          `;
        }
      }
    }

    function selectItem(idx) {
      activeIndex = idx;
      renderInventory();
      if (window.mp) {
        mp.trigger('client:inv:selectItem', inventoryItems[idx] ? inventoryItems[idx].id : null);
      }
    }

    function showContext(e, idx) {
      e.preventDefault();
      if (!inventoryItems[idx]) return;
      selectItem(idx);
      const menu = document.getElementById('ctxMenu');
      menu.style.display = 'flex';
      menu.style.left = `${e.pageX}px`;
      menu.style.top = `${e.pageY}px`;
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('#ctxMenu')) {
        document.getElementById('ctxMenu').style.display = 'none';
      }
    });

    function doAction(act) {
      document.getElementById('ctxMenu').style.display = 'none';
      if (activeIndex === -1 || !inventoryItems[activeIndex]) return;
      const target = inventoryItems[activeIndex];
      if (window.mp) {
        mp.trigger('client:inv:action', act, target.id);
      }
    }

    function unequipSlot(slotKey) {
      if (window.mp) mp.trigger('client:inv:unequip', slotKey);
    }

    // Входящие команды от клиента RAGE:MP
    window.invInterface = {
      updateItems: (itemsData, curW, maxW) => {
        inventoryItems = typeof itemsData === 'string' ? JSON.parse(itemsData) : itemsData;
        document.getElementById('curWeight').innerText = curW;
        document.getElementById('maxWeight').innerText = maxW;
        renderInventory();
      },
      updateStats: (mood, hunger, thirst) => {
        if (mood !== undefined) document.getElementById('valMood').innerText = mood + '%';
        if (hunger !== undefined) document.getElementById('valHunger').innerText = hunger + '%';
        if (thirst !== undefined) document.getElementById('valThirst').innerText = thirst + '%';
      }
    };
  </script>
</body>
</html>
