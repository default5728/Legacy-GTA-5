<!DOCTYPE html>
<html lang="ru">
<head><script src="package://shared/kepler-asset-map.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kepler RolePlay — Authorization</title>

  <!-- Typography -->
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/space-age-cyrillic">
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/space-age">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    :root {
      --bg-dark: #0a0b0e;
      --card-bg: rgba(16, 17, 22, 0.94);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(22, 24, 31, 0.98);

      --input-bg: #0e0f13;
      --input-border: #23252e;
      --input-border-focus: #4b5060;

      --text-white: #f8fafc;
      --text-muted: #8e92a0;
      --text-dim: #545766;

      --btn-submit-bg: #f8fafc;
      --btn-submit-text: #0e1015;
      --btn-submit-hover: #e2e8f0;

      --font-logo: 'Space Age Cyrillic', 'Space Age', sans-serif;
      --font-body: 'Inter', -apple-system, sans-serif;
      --font-num: 'Orbitron', sans-serif;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: var(--font-body);
      background-color: var(--bg-dark);
      color: var(--text-white);
      -webkit-font-smoothing: antialiased;
    }

    /* Atmospheric Backdrop */
    .gta-backdrop {
      position: fixed;
      inset: -20px;
      z-index: 1;
      background:
        radial-gradient(ellipse at 50% 50%, rgba(18, 20, 26, 0.45) 0%, rgba(8, 9, 12, 0.88) 100%),
        linear-gradient(180deg, rgba(8, 9, 12, 0.3) 0%, rgba(6, 7, 10, 0.95) 100%),
        url('bg.jpg') center/cover no-repeat;
      transform: scale(1.02);
      animation: subtleGtaPan 24s ease-in-out infinite alternate;
      will-change: transform;
    }

    @keyframes subtleGtaPan {
      0% { transform: scale(1.02); }
      100% { transform: scale(1.06); }
    }

    .viewport {
      position: relative;
      z-index: 10;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Top Right Online Badge */
    .top-header {
      position: absolute;
      top: 32px;
      right: 40px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-text {
      font-family: var(--font-logo);
      font-size: 19px;
      letter-spacing: 2px;
      color: #ffffff;
      line-height: 1;
    }

    .brand-planet-logo {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-planet-logo svg {
      width: 100%;
      height: 100%;
    }

    .minimal-online {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(14, 15, 20, 0.7);
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 8px;
    }

    .online-indicator-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.8);
    }

    .online-val {
      font-family: var(--font-num);
      font-weight: 700;
      font-size: 13px;
      color: #e2e8f0;
      letter-spacing: 0.5px;
    }

    /* ============================================================
       CENTER MONOLITHIC AUTH CARD (NEW REFINED DESIGN)
       ============================================================ */
    .auth-card {
      width: 410px;
      background: rgba(14, 16, 22, 0.96);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 32px 30px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 1px rgba(255, 255, 255, 0.1) inset;
    }

    /* Card Header */
    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-card-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #fff;
      margin-bottom: 4px;
    }

    .auth-card-subtitle {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Top Segmented Tab Switch */
    .auth-tabs-segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 22px;
    }

    .tab-pill {
      padding: 8px 12px;
      border-radius: 7px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-body);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
    }

    .tab-pill:hover {
      color: #fff;
    }

    .tab-pill.active {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    /* Forms */
    .form-group {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-row-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .form-label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.2px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .clean-input {
      width: 100%;
      height: 40px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 8px;
      padding: 0 14px;
      color: #ffffff;
      font-family: var(--font-body);
      font-size: 13px;
      outline: none;
      transition: all 0.15s ease;
      user-select: text !important;
      -webkit-user-select: text !important;
    }

    .clean-input::placeholder {
      color: var(--text-dim);
      font-size: 12.5px;
    }

    .clean-input:focus {
      border-color: var(--input-border-focus);
      background: #121319;
    }

    .toggle-password-btn {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 13px;
      transition: color 0.15s ease;
    }

    .toggle-password-btn:hover {
      color: var(--text-white);
    }

    /* Extra row (remember + forgot) */
    .form-extra-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      margin-bottom: 18px;
      font-size: 11.5px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .custom-checkbox {
      width: 15px;
      height: 15px;
      border-radius: 4px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }

    .custom-checkbox.checked {
      background: #ffffff;
      border-color: #ffffff;
    }

    .custom-checkbox.checked i {
      color: #0e1015;
      font-size: 9px;
    }

    .custom-checkbox i {
      display: none;
    }

    .custom-checkbox.checked i {
      display: block;
    }

    .restore-password-link {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.15s;
      cursor: pointer;
    }

    .restore-password-link:hover {
      color: #ffffff;
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      height: 42px;
      background: var(--btn-submit-bg);
      border: none;
      border-radius: 8px;
      color: var(--btn-submit-text);
      font-family: var(--font-body);
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover {
      background: var(--btn-submit-hover);
      transform: translateY(-1px);
    }

    .btn-submit:active {
      transform: translateY(1px);
    }

    /* Status Messages */
    .status-msg {
      display: none;
      font-size: 12px;
      padding: 9px 12px;
      border-radius: 8px;
      margin-bottom: 14px;
      text-align: center;
    }

    .status-msg.error {
      display: block;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .status-msg.warning, .status-msg.pending {
      display: block;
      background: rgba(245, 158, 11, 0.14);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #facc15;
    }

    .status-msg.success {
      display: block;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }

    @media (max-width: 480px) {
      .auth-card {
        width: 90vw;
        padding: 24px 20px;
      }
      .top-header {
        top: 20px;
        right: 20px;
      }
    }
  </style>
<style id="apathy-typography">/* Ordinary medium-weight type across the UI. Never use old-style figures. */
html,body,body *:not(i):not([class*="fa-"]){font-family:'Segoe UI',Arial,sans-serif!important;font-weight:600!important;font-style:normal!important;font-variant-numeric:lining-nums tabular-nums!important;font-feature-settings:"lnum" 1,"tnum" 1!important;}
</style>
</head>
<body>

  <!-- In-Game Backdrop -->
  <div class="gta-backdrop" id="gameBackdrop"></div>

  <div class="viewport">

    <!-- Top Right Brand & Online -->
    <div class="top-header">
      <div class="brand-title-group">
        <span class="brand-text">Kepler</span>
        <div class="brand-planet-logo" title="Kepler RolePlay">
          <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="46" r="30" stroke="#374154" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.6"/>
            <path d="M 50 56 C 48 65, 54 73, 51 81 C 49 87, 52 93, 50 98" stroke="#8fa0be" stroke-width="1.6" stroke-linecap="round"/>
            <circle cx="50" cy="46" r="17" fill="#1c212f" stroke="#5d6e8a" stroke-width="1.4"/>
            <path d="M 43 35 C 47 37, 44 42, 48 43 C 51 44, 53 40, 56 42 C 54 46, 47 48, 45 53 C 43 55, 39 53, 38 48 C 37 44, 40 38, 43 35 Z" fill="#44516a"/>
            <ellipse cx="50" cy="46" rx="35" ry="12" stroke="#8fa0be" stroke-width="1.8" transform="rotate(-28 50 46)" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="brand-text">RolePlay</span>
      </div>

      <div class="minimal-online">
        <span class="online-indicator-dot"></span>
        <span class="online-val" id="onlineCount">0</span>
      </div>
    </div>

    <!-- Center Authentication Card -->
    <div class="auth-card">

      <div class="auth-header">
        <div class="auth-card-title">Kepler RolePlay</div>
        <div class="auth-card-subtitle" id="authSubtitle">Авторизация в аккаунте</div>
      </div>

      <!-- Segmented Tab Switch -->
      <div class="auth-tabs-segmented">
        <button type="button" class="tab-pill active" id="tabBtnLogin" onclick="switchTab('login')">Вход</button>
        <button type="button" class="tab-pill" id="tabBtnRegister" onclick="switchTab('register')">Регистрация</button>
      </div>

      <div class="status-msg" id="statusMessage"></div>

      <!-- LOGIN FORM -->
      <form id="formLogin" onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label class="form-label">Логин / Email / Персонаж</label>
          <div class="input-wrapper">
            <input type="text" id="loginUsername" class="clean-input" placeholder="Alexander_Volkov" autocomplete="username" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Пароль</label>
          <div class="input-wrapper">
            <input type="password" id="loginPassword" class="clean-input" placeholder="Введите пароль" autocomplete="current-password" required>
            <button type="button" class="toggle-password-btn" onclick="togglePassVisibility('loginPassword', this)">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-extra-row">
          <label class="remember-me" onclick="toggleRememberCheckbox()">
            <span class="custom-checkbox checked" id="rememberCheckbox"><i class="fa-solid fa-check"></i></span>
            <span>Запомнить меня</span>
          </label>
          <span class="restore-password-link" onclick="handleForgotPassword()">Забыли пароль?</span>
        </div>

        <button type="submit" class="btn-submit">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> Войти в игру
        </button>
      </form>

      <!-- REGISTER FORM -->
      <form id="formRegister" onsubmit="handleRegisterSubmit(event)" style="display: none;">
        <div class="form-row-2col">
          <div class="form-group">
            <label class="form-label">Имя (латиница)</label>
            <div class="input-wrapper">
              <input type="text" id="regFirstName" class="clean-input" placeholder="Alexander" required>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Фамилия (латиница)</label>
            <div class="input-wrapper">
              <input type="text" id="regLastName" class="clean-input" placeholder="Volkov" required>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Электронная почта</label>
          <div class="input-wrapper">
            <input type="email" id="regEmail" class="clean-input" placeholder="example@mail.com" autocomplete="email" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Пароль</label>
          <div class="input-wrapper">
            <input type="password" id="regPassword" class="clean-input" placeholder="Минимум 6 символов" autocomplete="new-password" required>
            <button type="button" class="toggle-password-btn" onclick="togglePassVisibility('regPassword', this)">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Подтверждение пароля</label>
          <div class="input-wrapper">
            <input type="password" id="regPasswordConfirm" class="clean-input" placeholder="Повторите пароль" autocomplete="new-password" required>
            <button type="button" class="toggle-password-btn" onclick="togglePassVisibility('regPasswordConfirm', this)">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-submit" style="margin-top: 6px;">
          <i class="fa-solid fa-user-plus"></i> Создать аккаунт
        </button>
      </form>

    </div>

  </div>

  <script>
    let isRememberChecked = true;

    function toggleRememberCheckbox() {
      isRememberChecked = !isRememberChecked;
      const el = document.getElementById('rememberCheckbox');
      if (el) el.classList.toggle('checked', isRememberChecked);
    }

    function switchTab(tab) {
      hideStatus();
      const btnLogin = document.getElementById('tabBtnLogin');
      const btnRegister = document.getElementById('tabBtnRegister');
      const formLogin = document.getElementById('formLogin');
      const formRegister = document.getElementById('formRegister');
      const subTitle = document.getElementById('authSubtitle');

      if (tab === 'login') {
        btnLogin.classList.add('active');
        btnRegister.classList.remove('active');
        formLogin.style.display = 'block';
        formRegister.style.display = 'none';
        if (subTitle) subTitle.textContent = 'Авторизация в аккаунте';
      } else {
        btnRegister.classList.add('active');
        btnLogin.classList.remove('active');
        formLogin.style.display = 'none';
        formRegister.style.display = 'block';
        if (subTitle) subTitle.textContent = 'Регистрация нового аккаунта';
      }
    }

    function togglePassVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-regular fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fa-regular fa-eye';
      }
    }

    function showStatus(text, statusType = 'error') {
      const msg = document.getElementById('statusMessage');
      if (!msg) return;
      msg.textContent = text;
      msg.style.display = 'block';
      
      let cls = 'status-msg ';
      if (typeof statusType === 'boolean') {
        if (text && text.toLowerCase().includes('проверка')) {
          cls += 'warning';
        } else {
          cls += statusType ? 'success' : 'error';
        }
      } else if (text && text.toLowerCase().includes('проверка')) {
        cls += 'warning';
      } else {
        cls += statusType;
      }
      msg.className = cls;
    }

    function hideStatus() {
      const msg = document.getElementById('statusMessage');
      if (!msg) return;
      msg.style.display = 'none';
      msg.textContent = '';
      msg.className = 'status-msg';
    }

    function handleLoginSubmit(e) {
      if (e) {
        if (typeof e.preventDefault === 'function') e.preventDefault();
        if (typeof e.stopPropagation === 'function') e.stopPropagation();
      }

      const username = document.getElementById('loginUsername').value.trim();
      const pass = document.getElementById('loginPassword').value.trim();

      if (!username || !pass) {
        showStatus('Заполните все поля!');
        return;
      }

      showStatus('Проверка данных...', true);

      try {
        if (typeof mp !== 'undefined' && mp.trigger) {
          mp.trigger('client:auth:login', username, pass);
        } else if (typeof alt !== 'undefined' && alt.emit) {
          alt.emit('client:auth:login', username, pass);
        } else {
          showStatus('Вход выполнен (Тест режим в браузере)', true);
        }
      } catch (err) {
        showStatus('Ошибка отправки: ' + (err.message || err));
      }
    }

    function handleRegisterSubmit(e) {
      if (e) {
        if (typeof e.preventDefault === 'function') e.preventDefault();
        if (typeof e.stopPropagation === 'function') e.stopPropagation();
      }

      const firstName = document.getElementById('regFirstName').value.trim();
      const lastName = document.getElementById('regLastName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const pass = document.getElementById('regPassword').value;
      const passConfirm = document.getElementById('regPasswordConfirm').value;

      if (!firstName || !lastName) {
        showStatus('Укажите Имя и Фамилию персонажа');
        return;
      }
      if (!email || email.indexOf('@') === -1) {
        showStatus('Укажите корректный Email');
        return;
      }
      if (pass.length < 6) {
        showStatus('Пароль должен содержать минимум 6 символов');
        return;
      }
      if (pass !== passConfirm) {
        showStatus('Пароли не совпадают');
        return;
      }

      const username = `${firstName}_${lastName}`;
      showStatus('Регистрация аккаунта...', true);

      try {
        if (typeof mp !== 'undefined' && mp.trigger) {
          mp.trigger('client:auth:register', username, email, pass, firstName, lastName);
        } else if (typeof alt !== 'undefined' && alt.emit) {
          alt.emit('client:auth:register', username, email, pass, firstName, lastName);
        } else {
          showStatus('Регистрация прошла успешно (Тест режим)', true);
        }
      } catch (err) {
        showStatus('Ошибка отправки: ' + (err.message || err));
      }
    }

    function handleForgotPassword() {
      showStatus('Ссылка для восстановления отправлена на почту', true);
    }

    /* Public CEF API for Game Client */
    window.AUTH_INTERFACE = {
      setOnline: (count) => {
        const el = document.getElementById('onlineCount');
        if (el) el.textContent = count;
      },
      setError: (msg) => showStatus(msg, false),
      setSuccess: (msg) => showStatus(msg, true),
      setBackground: (url) => {
        const bd = document.getElementById('gameBackdrop');
        if (bd) bd.style.backgroundImage = `url('${url}')`;
      }
    };

    document.getElementById('gameBackdrop').style.backgroundImage = "url('bg.jpg')";
  </script>
</body>
</html>
