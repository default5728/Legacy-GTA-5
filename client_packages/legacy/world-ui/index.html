<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Legacy · Услуги</title><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#e6e8ed;font:14px Inter,"Segoe UI",sans-serif;user-select:none}main{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(620px,90vw);max-height:85vh;overflow:auto;padding:28px;background:rgba(15,17,20,.94);border:1px solid #ffffff16;border-radius:14px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}h1{font-size:21px;margin:4px 0}small{color:#8c95a1;letter-spacing:.1em;font-size:10px}button,input,select{font:inherit;color:inherit;border:1px solid #ffffff1c;border-radius:7px;background:#ffffff07;padding:10px 14px}button{cursor:pointer;transition:background 150ms}button:hover{background:#ffffff15}button:disabled{opacity:.4;cursor:wait}#close{padding:6px 10px}#goods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.product{padding:15px;border:1px solid #ffffff10;border-radius:8px;background:#ffffff03}.product h2{font-size:15px;margin:8px 0}.product p{color:#a9b0bc}.product button{width:100%}.balances{display:flex;gap:25px;padding:15px 0;margin-bottom:18px;border-top:1px solid #ffffff10;border-bottom:1px solid #ffffff10;font-variant-numeric:tabular-nums}#payment{display:flex;gap:10px;align-items:center;margin-bottom:20px;color:#aeb6c2}#notice{min-height:20px;margin-top:15px;color:#c5ad8d}#actions{display:flex;flex-wrap:wrap;gap:10px}.description{line-height:1.6;color:#b4bdc9;margin:0 0 20px}input{width:160px}.bank-actions{display:flex;gap:10px;margin-top:12px}[hidden]{display:none!important}
</style><link rel="stylesheet" href="package://controls/obsidian-select.css?v=2"><main><header><div><small>LEGACY ROLEPLAY</small><h1 id="title"></h1></div><button id="close" aria-label="Закрыть">×</button></header><div class="balances"><span>Наличные: <b id="cash">0</b> $</span><span>Банк: <b id="bank">0</b> $</span></div><label id="payment">Оплата <select id="paymentMethod"><option value="cash">Наличные</option><option value="bank">Банковская карта</option></select></label><div id="goods"></div><p id="description" class="description"></p><section id="bankControls" hidden><input id="amount" type="number" min="1" max="1000000000" step="1" placeholder="Сумма"><div class="bank-actions"><button data-bank="deposit">Внести на счёт</button><button data-bank="withdraw">Снять наличные</button></div></section><div id="actions"></div><div id="notice" role="status"></div></main><script>
let state=null,locked=false;const $=id=>document.getElementById(id),money=n=>Number(n||0).toLocaleString('ru-RU');
function act(action,extra={}){if(locked||!state)return;locked=true;document.querySelectorAll('button:not(#close)').forEach(b=>b.disabled=true);if(window.mp)mp.trigger('legacy:world:action:c',state.id,action,JSON.stringify({payment:$('paymentMethod').value,...extra}));setTimeout(unlock,1500);}
function unlock(){locked=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);}
function button(label,action){const b=document.createElement('button');b.textContent=label;b.onclick=()=>act(action);return b;}
window.WorldUI={notice(text){$('notice').textContent=String(text);unlock();},show(value){state=value;unlock();$('title').textContent=state.name;$('cash').textContent=money(state.cash);$('bank').textContent=money(state.bank);$('goods').replaceChildren();$('actions').replaceChildren();$('description').textContent='';$('notice').textContent='';$('bankControls').hidden=!['bank','atm'].includes(state.type);$('payment').hidden=['bank','atm'].includes(state.type);
 if(state.type==='shop')for(const item of state.goods){const el=document.createElement('article');el.className='product';const name=document.createElement('h2');name.textContent=item.name;const price=document.createElement('p');price.textContent=money(item.price)+' $ · '+item.weight+' кг';const buy=document.createElement('button');buy.textContent='Купить';buy.onclick=()=>act('buy',{item:item.key});el.append(name,price,buy);$('goods').append(el);}
 if(state.type==='house'){$('description').textContent=state.mine?'Ваш дом. Вход в личный интерьер.':state.owned?'Дом принадлежит другому игроку.':'Стоимость: '+money(state.price)+' $. Покупка сохраняется за персонажем.';if(state.mine)$('actions').append(button('Войти в дом','houseEnter'));else if(!state.owned)$('actions').append(button('Купить за '+money(state.price)+' $','houseBuy'));}
 if(state.type==='school'){$('description').textContent='Практический экзамен · 1 500 $. Пройдите маршрут на учебной машине, соблюдая ограничение 100 км/ч. Три превышения — экзамен не сдан. Результат сохраняется за персонажем.';$('actions').append(button('Начать экзамен','schoolStart'));}
 if(state.type==='service'){$('description').textContent='Полный ремонт автомобиля — 1 500 $. Подъедьте к мастеру на водительском месте.';$('actions').append(button('Отремонтировать','repair'));}
}};
$('close').onclick=()=>{if(window.mp)mp.trigger('legacy:world:close:c');};document.querySelectorAll('[data-bank]').forEach(b=>b.onclick=()=>act('bank',{amount:Number($('amount').value),mode:b.dataset.bank}));document.addEventListener('keydown',e=>{if(e.key==='Escape')$('close').click();});
</script><script src="package://controls/cef-input.js"></script><script src="package://controls/obsidian-select.js?v=2"></script></html>
