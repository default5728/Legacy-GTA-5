<!doctype html><html lang="ru"><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:transparent;color:#eee;font:14px 'Segoe UI',sans-serif;display:grid;place-items:center;height:100vh}main{background:rgba(17,17,20,.95);border:1px solid #ffffff18;border-radius:14px;padding:28px;width:420px}h2{font-size:18px}#list{display:grid;gap:8px;max-height:50vh;overflow:auto}button{padding:14px;background:#202025;color:#eee;border:1px solid #ffffff15;border-radius:8px;cursor:pointer}button:hover{background:#303038}small{color:#aaa}
</style><link rel="stylesheet" href="package://controls/obsidian-select.css?v=2"><main><h2>Установить номер</h2><p><small>Выберите сохранённый знак для своего автомобиля</small></p><div id="list"></div><p><button onclick="mp.trigger('client:plates:close')">Закрыть · Esc</button></p></main><script>
window.showChoices=data=>{const plates=Array.isArray(data)?data:data.plates;const list=document.getElementById('list');list.replaceChildren();if(data.installed){const remove=document.createElement('button');remove.textContent='Снять номер '+data.installed;remove.onclick=()=>mp.trigger('legacy:plates:remove');list.append(remove);}for(const plate of plates){const button=document.createElement('button');button.textContent=plate;button.onclick=()=>mp.trigger('legacy:plates:install',plate);list.appendChild(button);}};
document.addEventListener('keydown',e=>{if(e.key==='Escape')mp.trigger('client:plates:close');});mp.trigger('client:plates:ready');
</script><script src="package://controls/obsidian-select.js?v=2"></script></html>
